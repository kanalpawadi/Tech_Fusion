<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Your Booking Invoice | Tech Fusion</title>
  <link rel="icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #111; font-family: Inter, system-ui, sans-serif; color: #fff; }
    .bar {
      position: sticky; top: 0; z-index: 5;
      background: rgba(11,11,11,.94); backdrop-filter: blur(8px);
      border-bottom: 3px solid #ffd21f;
      padding: 12px 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: center;
    }
    .bar a, .bar button {
      font: 600 14px "Space Grotesk", system-ui, sans-serif; text-decoration: none; cursor: pointer;
      padding: 11px 18px; border-radius: 999px; border: 2px solid #ffd21f; background: transparent; color: #ffd21f;
    }
    .bar .primary { background: #ffd21f; color: #0b0b0b; }
    .bar a:hover, .bar button:hover { background: #fff; border-color: #fff; color: #0b0b0b; }
    .success {
      max-width: 860px; margin: 28px auto 18px; padding: 0 16px; text-align: center;
    }
    .success .tick {
      width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 50%; background: #ffd21f; color: #0b0b0b;
      display: grid; place-items: center; font-size: 34px; font-weight: 700;
      animation: pop .5s cubic-bezier(.2,1.6,.4,1) both;
    }
    .success h1 { font: 700 clamp(1.5rem, 4vw, 2.2rem) "Space Grotesk", sans-serif; margin: 0 0 6px; }
    .success p { color: #bdbdbd; margin: 0; }
    .mail-status {
      display: inline-block; margin: 14px auto 0 !important; padding: 10px 16px; border-radius: 10px;
      font-size: 14px; max-width: 640px;
    }
    .mail-status.ok { background: rgba(255,210,31,.12); border: 1px solid #ffd21f; color: #ffe27a !important; }
    .mail-status.warn { background: rgba(255,107,107,.12); border: 1px solid #ff6b6b; color: #ffb3b3 !important; }
    .wrap { padding: 0 14px 48px; }
    .missing { max-width: 560px; margin: 80px auto; text-align: center; padding: 0 16px; }
    .missing h1 { font-family: "Space Grotesk", sans-serif; color: #ffd21f; }
    .missing a { color: #ffd21f; }
    @media (max-width: 640px) {
      .bar { position: static; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .bar a, .bar button { padding: 10px 8px; font-size: 13px; text-align: center; }
      .bar #whatsapp { grid-column: 1 / -1; }
    }
    @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
    @media print { .bar, .success { display: none; } body { background: #fff; } .wrap { padding: 0; } }
    @media (prefers-reduced-motion: reduce) { .success .tick { animation: none; } }
  </style>
  <style id="invoice-css"></style>
</head>
<body>
  <nav class="bar" id="bar" hidden>
    <a href="index.html">← Back to site</a>
    <button type="button" id="download" class="primary">Download invoice</button>
    <button type="button" id="print">Print / Save PDF</button>
    <a id="whatsapp" target="_blank" rel="noopener">Send to Tech Fusion on WhatsApp</a>
  </nav>

  <section class="success" id="success" hidden>
    <div class="tick" aria-hidden="true">✓</div>
    <h1 id="success-title">Project registered!</h1>
    <p id="success-msg"></p>
    <p id="mail-status" class="mail-status" role="status" hidden></p>
  </section>

  <main class="wrap" id="invoice"></main>

  <section class="missing" id="missing" hidden>
    <h1>Invoice not found</h1>
    <p>This link doesn't contain a booking. Please register your project again.</p>
    <p><a href="index.html#register">Register a project</a></p>
  </section>

  <script src="invoice.js?v=7"></script>
  <script>
    (function () {
      const T = window.TFInvoice;
      let booking = null;
      try { booking = T.decode(location.hash.slice(1)); } catch (e) { booking = null; }

      if (!booking || !booking.id || !booking.projectName) {
        document.getElementById('missing').hidden = false;
        return;
      }

      document.title = `Invoice ${booking.id} | Tech Fusion`;
      document.getElementById('invoice-css').textContent = T.CSS;
      document.getElementById('invoice').innerHTML = T.renderBody(booking);
      const mail = new URLSearchParams(location.search).get('mail');
      const status = document.getElementById('mail-status');
      if (mail) {
        document.getElementById('success-msg').textContent = `Booking ID ${booking.id} · Your invoice has been downloaded.`;
        status.hidden = false;
        if (mail === 'sent') {
          status.classList.add('ok');
          status.textContent = `✉ Confirmation emailed to ${booking.email} — Tech Fusion has received your booking.`;
        } else if (mail === 'backup') {
          status.classList.add('ok');
          status.textContent = `✓ Tech Fusion has received your booking. Our confirmation email may be delayed, so please keep this invoice — we'll contact you on ${booking.phone}.`;
        } else {
          status.classList.add('warn');
          status.textContent = `We couldn't send the confirmation email right now. Please tap "Send to Tech Fusion on WhatsApp" so we receive your booking.`;
        }
      } else {
        // Opened later, e.g. from the link in the confirmation email
        document.getElementById('success-title').textContent = 'Your booking invoice';
        document.querySelector('.tick').textContent = '✉';
        document.getElementById('success-msg').textContent = `Booking ID ${booking.id} · Download or print it any time.`;
      }
      document.getElementById('success').hidden = false;
      document.getElementById('bar').hidden = false;

      document.getElementById('download').addEventListener('click', () => T.download(booking));
      document.getElementById('print').addEventListener('click', () => window.print());
      document.getElementById('whatsapp').href =
        `https://wa.me/${T.BUSINESS.whatsapp}?text=${encodeURIComponent(T.whatsappText(booking))}`;
    })();
  </script>
</body>
</html>
